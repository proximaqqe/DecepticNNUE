
name: Build DecepticNNUE Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "DecepticNNUE_Local_MVP.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract app source
        run: |
          unzip -o DecepticNNUE_Local_MVP.zip -d app
          cd app
          flutter create --platforms=android --project-name deceptic_nnue .
          flutter pub get

      - name: Check Dart code
        working-directory: app
        run: flutter analyze

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DecepticNNUE-debug-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          
